<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="مؤسسة إنكي للدراسات والبحوث — الأخبار والدراسات والإصدارات ومجلة إنكي">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="إنكي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>مؤسسة إنكي للدراسات والبحوث</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#F4F7FF;margin:0;width:100%;overflow-x:hidden">
  <div id="enke-loading" dir="rtl">
    <div class="enke-ring"><img src="icons/Icon-192.png" alt="إنكي"></div>
    <h1>مؤسسة إنكي للدراسات والبحوث</h1>
    <p>Enki Foundation for Studies and Research</p>
    <div class="enke-dots"><i></i><i></i><i></i></div>
  </div>
  <style>
    #enke-loading{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;
      align-items:center;justify-content:center;text-align:center;
      background:linear-gradient(180deg,#BCCFF4 0%,#DCE6FA 26%,#F4F7FF 62%);
      font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;
      transition:opacity .45s ease}
    #enke-loading.done{opacity:0;pointer-events:none}
    .enke-ring{width:128px;height:128px;border-radius:50%;padding:5px;background:#FFFDF8;
      border:2px solid rgba(201,138,46,.55);box-shadow:0 18px 44px -14px rgba(107,85,39,.45);
      animation:enkePulse 2.4s ease-in-out infinite}
    .enke-ring img{width:100%;height:100%;border-radius:50%;display:block}
    #enke-loading h1{margin:22px 0 4px;font-size:19px;color:#382A12;font-weight:800}
    #enke-loading p{margin:0;font-size:11.5px;color:#8A6D35;letter-spacing:.4px}
    .enke-dots{display:flex;gap:7px;margin-top:26px}
    .enke-dots i{width:8px;height:8px;border-radius:50%;background:#2456B8;opacity:.3;
      animation:enkeDot 1.2s ease-in-out infinite}
    .enke-dots i:nth-child(2){animation-delay:.2s}
    .enke-dots i:nth-child(3){animation-delay:.4s}
    @keyframes enkePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes enkeDot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
  </style>
  <script>
    window.addEventListener('flutter-first-frame',function(){
      var e=document.getElementById('enke-loading');
      if(e){e.classList.add('done');setTimeout(function(){e.remove();},500);}
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
